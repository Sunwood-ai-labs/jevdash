<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Cyber Grid Subtle Lines -->
  <path d="M 64 256 H 448 M 256 64 V 448" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8" />
  
  <!-- Neural / System One Decision Nodes -->
  <circle cx="160" cy="160" r="16" fill="url(#purpleGrad)" />
  <circle cx="352" cy="160" r="16" fill="url(#purpleGrad)" />
  <path d="M 160 160 L 256 224 L 352 160" stroke="#475569" stroke-width="6" stroke-linecap="round" />

  <!-- Runner / Dash Chevron Form -->
  <path d="M 140 340 L 256 224 L 200 224 L 316 110" fill="none" stroke="url(#cyanGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Leap Trajectory Arc -->
  <path d="M 120 380 Q 256 240 392 380" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="16 12" />

  <!-- Goal Flag / Portal Anchor -->
  <rect x="360" y="320" width="32" height="60" rx="6" fill="url(#purpleGrad)" />
  <polygon points="392,330 432,345 392,360" fill="url(#emeraldGrad)" />

  <!-- Ground Line -->
  <rect x="80" y="380" width="352" height="12" rx="6" fill="#38bdf8" />
</svg>
