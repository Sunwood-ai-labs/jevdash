[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevdash"
version = "0.1.0"
description = "A 100% clean-room, copyright-free 2D side-scrolling platformer for TypeSafe Jev AI real-time control benchmarking at 60 FPS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pygame>=2.6.0",
  "pydantic>=2.7.0",
  "typesafe-sdk>=0.7.0",
]

[project.optional-dependencies]
vision-recording = ["av==16.1.0", "numpy>=2,<3", "Pillow>=11"]
clef = [
  "av==16.1.0", "numpy>=2,<3", "Pillow>=11",
  "torch==2.11.0", "torchvision==0.26.0", "transformers==5.10.2",
  "accelerate", "huggingface_hub", "safetensors",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
]

[project.scripts]
jevdash = "jev_platformer.cli:main"
jev-platformer = "jev_platformer.cli:main"
jev-runner = "jev_platformer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_platformer"]

[tool.ruff.lint.isort]
known-first-party = ["jev_platformer"]
